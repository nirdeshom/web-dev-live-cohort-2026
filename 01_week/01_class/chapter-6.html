<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

    <!-- Table 1 -->
    <h2>City Table</h2>

    <table border="1">
        <tr>
            <th>City</th>
            <th>Country</th>
            <th>Population</th>
        </tr>

        <tr>
            <td>Lucknow</td>
            <td>India</td>
            <td>35 Lakhs</td>
        </tr>

        <tr>
            <td>Delhi</td>
            <td>India</td>
            <td>3 Crore</td>
        </tr>

        <tr>
            <td>Mumbai</td>
            <td>India</td>
            <td>2 Crore</td>
        </tr>
    </table>

    <!-- Table 2 -->
    <table border="1">
        <caption>Favorite Foods</caption>

        <tr>
            <th>Food</th>
            <th>Category</th>
        </tr>

        <tr>
            <td>Pizza</td>
            <td>Fast Food</td>
        </tr>

        <tr>
            <td>Mango</td>
            <td>Fruit</td>
        </tr>

        <tr>
            <td>Paneer</td>
            <td>Vegetarian</td>
        </tr>
    </table>

    <!-- Table 3 -->
    <table border="1">
        <caption>Weekly Schedule</caption>

        <tr>
            <th>Day</th>
            <th colspan="2">Activities</th>
        </tr>

        <tr>
            <td rowspan="2">Monday</td>
            <td>Morning</td>
            <td>Coding Practice</td>
        </tr>

        <tr>
            <td>Evening</td>
            <td>Gym</td>
        </tr>

        <tr>
            <td rowspan="2">Tuesday</td>
            <td>Morning</td>
            <td>Study</td>
        </tr>

        <tr>
            <td>Evening</td>
            <td>Project Work</td>
        </tr>

    </table>

</body>
