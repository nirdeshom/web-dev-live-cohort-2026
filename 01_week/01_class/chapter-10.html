<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>HTML Form</h1>

    <form action="" method="post">
        <label for="name">Enter Name:</label>
        <input type="text" name="myName" id="name" placeholder="Enter Name" required>
        <br>

        <label for="email">Enter Email:</label>
        <input type="email" name="myEmail" id="email" placeholder="example@gmail.com" required>
        <br>

        <label for="password">Password:</label>
        <input type="password" name="myPassword" id="password" placeholder="*********" required>
        <br>

        <label for="gender">Gender:</label>
        <input type="radio" name="myGender" id="gender" value="male">Male
        <input type="radio" name="myGender" id="gender" value="femail">femail
        <br>

        <label for="checkbox">Chose Hobby</label>
        <input type="checkbox" name="myBox" id="checkbox" value="Criket">Criket
        <input type="checkbox" name="myBox" id="checkbox" value="Ludo">Ludo
        <input type="checkbox" name="myBox" id="checkbox" value="Snape">Snape
        <br>

        <label for="message">message</label><br>
        <textarea name="myMessage" id="message" cols="20" rows="6" placeholder="Write a Message"></textarea>
        <br>

        <label for="language">Programming</label>
        <select name="language" id="language">
            <option value="java">Java</option>
            <option value="javascript">JavaScript</option>
            <option value="php">PHP</option>
        </select>
        <br>

        <label for="">DOB</label>
        <input type="date" name="dob" id="">
        <br>

        <label for="">Upload Image</label>
        <input type="file" name="" id="">
        <br>

        <input type="submit" value="submit">
        <br>
        <input type="reset" value="reset">
    </form>
</body>
</html>
