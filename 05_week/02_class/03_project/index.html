<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOB Calculater</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        div {
            width: 100%;
            height: 100vh;
            background-color: #2f2f2f;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        form {
            width: 40%;
            height: 60%;
            background: #c8b9b9;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 30px;
            border-radius: 30px;
        }

        label {
            font-size: 30px;
            font-weight: 800;
        }

        button {
            padding: 10px 30px;
            font-size: 14px;
            font-weight: 700;
            border: 1px solid grey;
            border-radius: 8px;
            background: #d2a921;
        }

        input {
            padding: 8px 30px;
            border-radius: 2px;
            border: none;
        }

        /* input:focus{
            border: 4px solid red
        } */
    </style>
</head>

<body>
    <div>
        <form action="">
            <label for="">Date of Birth</label>
            <input type="date" name="" id="dob">

            <label for="">Current date</label>
            <input type="date" name="" id="currDate">

            <button>Calculate</button>
            <h2>Result</h2>
        </form>
    </div>
</body>
<script>
    let button = document.querySelector('button');
    let result = document.querySelector('h2');

    button.addEventListener('click', function (e) {
        e.preventDefault();

        let dob = document.querySelector('#dob').value;
        let currentDate = document.querySelector('#currDate').value;

        // Input validation
        if (!dob) {
            result.innerHTML = "Please select DOB";
            return;
        }

        if (!currentDate) {
            result.innerHTML = "Please select Current Date";
            return;
        }

        // Convert string to Date object
        let myDOB = new Date(dob);
        let myCurrent = new Date(currentDate);

        // Initial calculation
        let year = myCurrent.getFullYear() - myDOB.getFullYear();
        let month = myCurrent.getMonth() - myDOB.getMonth();
        let days = myCurrent.getDate() - myDOB.getDate(); // ✅ FIXED

        // 🔥 Day fix (borrow from month)
        if (days < 0) {
            month--;

            let prevMonthDays = new Date(
                myCurrent.getFullYear(),
                myCurrent.getMonth(),
                0
            ).getDate();

            days += prevMonthDays;
        }

        // 🔥 Month fix (borrow from year)
        if (month < 0) {
            year--;
            month += 12;
        }

        // Final output
        result.innerHTML = `${year} year, ${month} month, ${days} day`;

        document.querySelector('#dob').value = "";
        document.querySelector('#currDate').value = "";
    });
</script>
